<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Standby">
<meta name="theme-color" content="#000000">
<title>Better Standby</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg">
<style>
  :root {
    --text: #ffffff;
    --accent: #7cc4ff;
    --panel: rgba(28, 28, 32, 0.92);
    --panel-line: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #000; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }

  /* ---------- photo slideshow ---------- */
  #slides { position: fixed; inset: 0; }
  .slide {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1.5s ease;
  }
  .slide.show { opacity: 1; }
  #slides::after { /* darken behind the clock so text stays readable */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.65) 0%, rgba(0,0,0,.25) 45%, rgba(0,0,0,0) 70%);
  }
  body.no-photos #slides::after { display: none; }

  /* ---------- clock ---------- */
  #clock {
    position: fixed; z-index: 2;
    left: max(5vw, env(safe-area-inset-left)); bottom: 9vh;
    text-shadow: 0 2px 18px rgba(0,0,0,.55);
    pointer-events: none;
  }
  body.no-photos #clock {
    left: 50%; bottom: 50%; transform: translate(-50%, 50%); text-align: center;
  }
  #time {
    font-size: min(26vw, 48vh); font-weight: 600; line-height: .9;
    letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  #time .ampm { font-size: .22em; font-weight: 500; letter-spacing: 0; margin-left: .15em; opacity: .85; }
  #time .colon { opacity: .9; }
  #day  { font-size: min(6vw, 11vh); font-weight: 600; margin-top: 2vh; color: var(--accent); }
  #date { font-size: min(4.2vw, 7.5vh); font-weight: 400; opacity: .85; margin-top: .4vh; }

  /* ---------- brightness + tint overlays (on top of everything but the menu) ---------- */
  #tint, #dim { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #tint { mix-blend-mode: multiply; }
  #dim  { background: #000; }

  /* ---------- gear button ---------- */
  #gear {
    position: fixed; z-index: 10;
    top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));
    width: 48px; height: 48px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.35); color: #fff;
    display: grid; place-items: center; cursor: pointer;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: opacity .6s ease, transform .3s ease;
  }
  #gear svg { width: 26px; height: 26px; }
  #gear:active { transform: rotate(45deg) scale(.92); }
  body.idle #gear { opacity: 0; pointer-events: none; }

  /* ---------- settings menu ---------- */
  #menuBackdrop {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #menu {
    position: fixed; z-index: 21;
    top: max(10px, env(safe-area-inset-top)); bottom: max(10px, env(safe-area-inset-bottom));
    right: max(10px, env(safe-area-inset-right));
    width: min(380px, calc(100vw - 20px));
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 22px;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    padding: 18px 18px 22px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    transform: translateX(calc(100% + 30px)); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  body.menu-open #menu { transform: none; }
  body.menu-open #menuBackdrop { opacity: 1; pointer-events: auto; }

  #menu header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #menu h2 { margin: 0; font-size: 22px; }
  #closeMenu {
    border: 0; background: rgba(255,255,255,.12); color: #fff;
    width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer;
  }
  .section { padding: 14px 0; border-bottom: 1px solid var(--panel-line); }
  .section:last-child { border-bottom: 0; }
  .label { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .label span:last-child { font-weight: 400; opacity: .7; font-variant-numeric: tabular-nums; }

  input[type=range] { width: 100%; height: 32px; accent-color: var(--accent); }

  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25);
    cursor: pointer; position: relative; padding: 0;
  }
  .swatch.selected { border-color: #fff; box-shadow: 0 0 0 3px var(--accent); }
  .swatch.none { background: conic-gradient(#fff 0 25%, #888 0 50%, #fff 0 75%, #888 0); }
  .swatch.custom { overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .swatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

  .btn {
    display: block; width: 100%; padding: 13px; margin-top: 10px;
    border: 0; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #00182b; text-align: center;
  }
  .btn.secondary { background: rgba(255,255,255,.12); color: #fff; }
  .btn.danger { background: rgba(255,80,80,.18); color: #ff8a8a; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }

  .seg { display: flex; background: rgba(255,255,255,.1); border-radius: 10px; padding: 3px; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: #fff; padding: 8px; border-radius: 8px;
    font-size: 14px; cursor: pointer;
  }
  .seg button.on { background: rgba(255,255,255,.22); font-weight: 600; }

  #albumInfo { font-size: 14px; opacity: .75; margin-top: 4px; }
  #thumbs { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 4px; }
  #thumbs img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; flex: none; }
  #progress { font-size: 14px; color: var(--accent); margin-top: 8px; min-height: 1em; }

  /* portrait hint */
  #rotate {
    display: none; position: fixed; z-index: 15; left: 50%; top: max(20px, env(safe-area-inset-top));
    transform: translateX(-50%); background: rgba(0,0,0,.6); padding: 8px 14px; border-radius: 20px;
    font-size: 14px; white-space: nowrap; pointer-events: none;
  }
  @media (orientation: portrait) {
    #rotate { display: block; }
    #time { font-size: 24vw; }
    #day  { font-size: 7vw; }
    #date { font-size: 5vw; }
    #clock { bottom: 12vh; }
    #slides::after { background: linear-gradient(0deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,0) 60%); }
  }
</style>
</head>
<body class="no-photos">

<div id="slides"></div>

<div id="clock">
  <div id="time">--:--</div>
  <div id="day">&nbsp;</div>
  <div id="date">&nbsp;</div>
</div>

<div id="tint"></div>
<div id="dim"></div>
<div id="rotate">↻ Turn your phone sideways</div>

<button id="gear" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<div id="menuBackdrop"></div>
<aside id="menu" aria-label="Settings menu">
  <header>
    <h2>Settings</h2>
    <button id="closeMenu" aria-label="Close">✕</button>
  </header>

  <div class="section">
    <div class="label"><span>☀️ Brightness</span><span id="brightVal">100%</span></div>
    <input type="range" id="brightness" min="5" max="100" step="1" value="100">
  </div>

  <div class="section">
    <div class="label"><span>🎨 Color tint</span><span id="tintVal">Off</span></div>
    <div class="swatches" id="swatches"></div>
    <div class="label" style="margin-top:14px"><span>Tint strength</span><span id="tintStrVal">50%</span></div>
    <input type="range" id="tintStrength" min="0" max="100" step="1" value="50">
  </div>

  <div class="section">
    <div class="label"><span>🖼️ Photo album</span></div>
    <div id="albumInfo">No photos yet</div>
    <div id="thumbs"></div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <button class="btn" id="uploadBtn">Upload photos</button>
    <div id="progress"></div>
    <div class="label" style="margin-top:14px"><span>Change photo every</span><span id="intervalVal">10 s</span></div>
    <input type="range" id="interval" min="3" max="120" step="1" value="10">
    <div class="row">
      <button class="btn secondary" id="shuffleBtn">Shuffle: On</button>
      <button class="btn danger" id="clearBtn">Clear album</button>
    </div>
  </div>

  <div class="section">
    <div class="label"><span>🕒 Clock</span></div>
    <div class="seg" id="hourSeg">
      <button data-v="12">12-hour</button>
      <button data-v="24">24-hour</button>
    </div>
    <div class="label" style="margin-top:14px"><span>Accent color</span></div>
    <div class="swatches" id="accentSwatches"></div>
  </div>

  <div class="section">
    <button class="btn secondary" id="fullscreenBtn">Keep screen awake</button>
    <div id="albumInfo" style="margin-top:8px">Tip: in Safari tap Share → “Add to Home Screen” to run it full screen like an app.</div>
  </div>
</aside>

<script>
(() => {
  const $ = id => document.getElementById(id);

  /* ================= settings (saved in localStorage) ================= */
  const DEFAULTS = {
    brightness: 100, tint: null, tintStrength: 50,
    interval: 10, shuffle: true, hour: 12, accent: '#7cc4ff'
  };
  let S = { ...DEFAULTS };
  try { Object.assign(S, JSON.parse(localStorage.getItem('standby-settings') || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem('standby-settings', JSON.stringify(S)); } catch (e) {} };

  const TINTS = [
    { name: 'Off', c: null },
    { name: 'Night red', c: '#ff2a1a' },
    { name: 'Warm', c: '#ff9a3c' },
    { name: 'Amber', c: '#ffc94a' },
    { name: 'Green', c: '#4dff88' },
    { name: 'Cyan', c: '#3ce6ff' },
    { name: 'Blue', c: '#4a7dff' },
    { name: 'Purple', c: '#b04aff' },
    { name: 'Pink', c: '#ff4ab4' },
  ];
  const ACCENTS = ['#7cc4ff', '#ffffff', '#ffb347', '#ff6b6b', '#7dff9a', '#c48bff', '#ffe066'];

  /* ================= clock ================= */
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function tick() {
    const d = new Date();
    let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0');
    let ampm = '';
    if (S.hour === 12) { ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; }
    else h = String(h).padStart(2, '0');
    $('time').innerHTML = `${h}<span class="colon">:</span>${m}${ampm ? `<span class="ampm">${ampm}</span>` : ''}`;
    $('day').textContent = DAYS[d.getDay()];
    $('date').textContent = `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  }
  tick();
  setInterval(tick, 1000);

  /* ================= photo storage (IndexedDB, so the album survives reloads) ================= */
  let dbP = null;
  function db() {
    if (!dbP) dbP = new Promise((res, rej) => {
      const r = indexedDB.open('standby-album', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbP;
  }
  async function store(mode) { return (await db()).transaction('photos', mode).objectStore('photos'); }
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function addPhoto(blob) { return req((await store('readwrite')).add({ blob, added: Date.now() })); }
  async function allPhotos() { return req((await store('readonly')).getAll()); }
  async function clearPhotos() { return req((await store('readwrite')).clear()); }

  // Shrink big iPhone photos so they load fast and don't fill up storage
  async function shrink(file, max = 2000) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      bmp.close && bmp.close();
      return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.86));
    } catch (e) { return file; }
  }

  /* ================= slideshow ================= */
  let urls = [], order = [], pos = 0, timer = null, front = null;
  const slidesEl = $('slides');
  const layers = [document.createElement('div'), document.createElement('div')];
  layers.forEach(l => { l.className = 'slide'; slidesEl.appendChild(l); });

  function makeOrder() {
    order = urls.map((_, i) => i);
    if (S.shuffle) for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
  }
  function showNext() {
    if (!urls.length) return;
    if (pos >= order.length) makeOrder();
    const url = urls[order[pos++]];
    const img = new Image();
    img.onload = () => {
      const back = front === layers[0] ? layers[1] : layers[0];
      back.style.backgroundImage = `url("${url}")`;
      back.classList.add('show');
      if (front) front.classList.remove('show');
      front = back;
    };
    img.src = url;
  }
  function restartTimer() {
    clearInterval(timer);
    if (urls.length > 1) timer = setInterval(showNext, S.interval * 1000);
  }
  async function loadAlbum() {
    urls.forEach(u => URL.revokeObjectURL(u));
    let photos = [];
    try { photos = await allPhotos(); } catch (e) {}
    urls = photos.map(p => URL.createObjectURL(p.blob));
    document.body.classList.toggle('no-photos', urls.length === 0);
    $('albumInfo').textContent = urls.length ? `${urls.length} photo${urls.length > 1 ? 's' : ''} in album` : 'No photos yet';
    $('thumbs').innerHTML = '';
    urls.slice(0, 40).forEach(u => { const i = new Image(); i.src = u; $('thumbs').appendChild(i); });
    if (!urls.length) { layers.forEach(l => { l.classList.remove('show'); l.style.backgroundImage = ''; }); front = null; }
    makeOrder(); showNext(); restartTimer();
  }

  $('uploadBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = async e => {
    const files = [...e.target.files];
    if (!files.length) return;
    for (let i = 0; i < files.length; i++) {
      $('progress').textContent = `Adding photo ${i + 1} of ${files.length}…`;
      try { await addPhoto(await shrink(files[i])); }
      catch (err) { $('progress').textContent = 'Storage is full — try fewer photos.'; break; }
    }
    $('progress').textContent = `Added ${files.length} photo${files.length > 1 ? 's' : ''} ✓`;
    setTimeout(() => $('progress').textContent = '', 3000);
    e.target.value = '';
    loadAlbum();
  };
  $('clearBtn').onclick = async () => {
    if (!confirm('Remove all photos from the album?')) return;
    await clearPhotos(); loadAlbum();
  };
  $('shuffleBtn').onclick = () => { S.shuffle = !S.shuffle; save(); applyUI(); makeOrder(); };

  /* ================= brightness / tint / clock settings ================= */
  function buildSwatches() {
    $('swatches').innerHTML = '';
    TINTS.forEach(t => {
      const b = document.createElement('button');
      b.className = 'swatch' + (t.c ? '' : ' none');
      if (t.c) b.style.background = t.c;
      b.title = t.name; b.dataset.c = t.c || '';
      b.onclick = () => { S.tint = t.c; save(); apply(); };
      $('swatches').appendChild(b);
    });
    const custom = document.createElement('label');
    custom.className = 'swatch custom'; custom.title = 'Pick any color';
    custom.innerHTML = '<input type="color" value="#ff8800">';
    custom.querySelector('input').oninput = e => { S.tint = e.target.value; save(); apply(); };
    $('swatches').appendChild(custom);

    $('accentSwatches').innerHTML = '';
    ACCENTS.forEach(c => {
      const b = document.createElement('button');
      b.className = 'swatch'; b.style.background = c; b.dataset.c = c;
      b.onclick = () => { S.accent = c; save(); apply(); };
      $('accentSwatches').appendChild(b);
    });
  }

  function apply() {
    // Brightness: a black layer on top. 100% = no dimming.
    $('dim').style.opacity = (1 - S.brightness / 100).toFixed(2);
    // Tint: a colored layer blended over the whole screen.
    const t = $('tint');
    if (S.tint) { t.style.background = S.tint; t.style.opacity = (S.tintStrength / 100).toFixed(2); }
    else t.style.opacity = 0;
    document.documentElement.style.setProperty('--accent', S.accent);
    applyUI(); tick();
  }
  function applyUI() {
    $('brightness').value = S.brightness; $('brightVal').textContent = S.brightness + '%';
    $('tintStrength').value = S.tintStrength; $('tintStrVal').textContent = S.tintStrength + '%';
    const named = TINTS.find(t => t.c === S.tint);
    $('tintVal').textContent = S.tint ? (named ? named.name : 'Custom') : 'Off';
    document.querySelectorAll('#swatches .swatch').forEach(b => {
      const isCustom = b.classList.contains('custom');
      b.classList.toggle('selected', isCustom ? (S.tint && !named) : (b.dataset.c || null) === S.tint);
    });
    document.querySelectorAll('#accentSwatches .swatch').forEach(b => b.classList.toggle('selected', b.dataset.c === S.accent));
    $('interval').value = S.interval; $('intervalVal').textContent = S.interval < 60 ? `${S.interval} s` : `${Math.floor(S.interval/60)} min${S.interval % 60 ? ' ' + S.interval % 60 + ' s' : ''}`;
    $('shuffleBtn').textContent = 'Shuffle: ' + (S.shuffle ? 'On' : 'Off');
    document.querySelectorAll('#hourSeg button').forEach(b => b.classList.toggle('on', +b.dataset.v === S.hour));
  }

  $('brightness').oninput = e => { S.brightness = +e.target.value; save(); apply(); };
  $('tintStrength').oninput = e => { S.tintStrength = +e.target.value; save(); apply(); };
  $('interval').oninput = e => { S.interval = +e.target.value; save(); applyUI(); };
  $('interval').onchange = restartTimer;
  document.querySelectorAll('#hourSeg button').forEach(b => b.onclick = () => { S.hour = +b.dataset.v; save(); apply(); });

  /* ================= menu open / close + auto-hide gear ================= */
  const openMenu = () => document.body.classList.add('menu-open');
  const closeMenu = () => document.body.classList.remove('menu-open');
  $('gear').onclick = e => { e.stopPropagation(); openMenu(); };
  $('closeMenu').onclick = closeMenu;
  $('menuBackdrop').onclick = closeMenu;

  let idleT;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => { if (!document.body.classList.contains('menu-open')) document.body.classList.add('idle'); }, 5000);
  }
  ['pointerdown', 'touchstart', 'mousemove'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
  wake();

  /* ================= keep the screen on ================= */
  let lock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator) {
        lock = await navigator.wakeLock.request('screen');
        $('fullscreenBtn').textContent = 'Screen will stay awake ✓';
        lock.addEventListener('release', () => { $('fullscreenBtn').textContent = 'Keep screen awake'; });
      } else {
        $('fullscreenBtn').textContent = 'Not supported — set Auto-Lock to Never';
      }
    } catch (e) { $('fullscreenBtn').textContent = 'Tap again to keep screen awake'; }
  }
  $('fullscreenBtn').onclick = keepAwake;
  // Ask on first tap anywhere (browsers need a tap first), and again when coming back to the page
  document.addEventListener('pointerdown', function first() { keepAwake(); document.removeEventListener('pointerdown', first); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && lock) keepAwake(); });

  /* ================= start ================= */
  buildSwatches();
  apply();
  loadAlbum();
})();
</script>
</body>
</html>
